header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
header .lg{height:54px;width:auto;background:#fff;border-radius:12px;padding:7px 9px;flex:none}
header h1{margin:0;font-size:1.2rem}header p{margin:4px 0 0;font-size:.85rem;opacity:.9}
main{max-width:760px;margin:0 auto;padding:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 6px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;width:100%;cursor:pointer}
button.sec{background:#fde6e7;color:var(--pri);width:auto;padding:8px 14px;font-size:.85rem}
button:disabled{opacity:.55;cursor:default}
.pick{border:2px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--mut);position:relative;cursor:pointer}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.prev div{position:relative}.prev img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.prev b{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;width:22px;height:22px;text-align:center;line-height:22px;font-size:.8rem;cursor:pointer}
#bar{height:8px;background:#e5e9ef;border-radius:99px;overflow:hidden;margin-top:10px;display:none}
#bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
#msg{font-size:.85rem;margin-top:8px;text-align:center}
.warn{background:#fde7e4;color:var(--err);padding:10px;border-radius:8px;font-size:.85rem;margin-bottom:14px;display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.g{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff}
.g img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef1f5}
.g div{padding:8px 10px;font-size:.8rem}.g small{color:var(--mut);display:block}
.t{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-bottom:4px}
.t.Before{background:#fff1d6;color:#9a6700}.t.After{background:#dff5ec;color:var(--ok)}
.hide{display:none}
.cap{font-size:.72rem;font-weight:700;color:var(--mut);margin:0 0 4px;text-transform:uppercase}
.grp{margin-top:16px}.grp h3{font-size:.95rem;margin:0 0 6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols .g{margin-bottom:8px}
.prev b.rt{top:auto;bottom:3px;background:var(--pri)}
.row button{width:100%;padding:13px}
</style>
</head>

<main>
<div class="warn" id="warn">⚠️ URL Apps Script belum diisi. Buka index.html lalu isi <b>APPS_SCRIPT_URL</b>.</div>

<div class="box">
  <h2>1. Pilih Lokasi Audit</h2>
  <select id="lokasi"></select>
</div>

<div class="box hide" id="form">
  <h2>2. Data Audit</h2>
  <label for="auditor">Nama Auditor</label><input id="auditor" placeholder="Nama Anda">
  <div class="row">
    <div><label for="tgl">Tanggal Audit</label><input type="date" id="tgl"></div>
    <div><label for="jam">Jam</label><input type="time" id="jam"></div>
  </div>
  <div class="row">
    <div><label for="tahap">Jenis Foto</label><select id="tahap"><option>Before</option><option>After</option></select></div>
    <div><label for="item">Item / Area</label><select id="item"></select></div>
  </div>
  <div id="ref"></div>
  <label>Foto (bisa pilih lebih dari satu)</label>
  <div class="pick">📷 Ketuk untuk ambil foto / pilih dari galeri<input type="file" id="file" accept="image/*" multiple></div>
  <div class="prev" id="prev"></div>
  <input type="file" id="re" accept="image/*" class="hide">
  <label for="cat">Catatan (opsional)</label><textarea id="cat" placeholder="Kondisi / temuan di area ini..."></textarea>
  <div class="row" style="margin-top:12px"><button class="sec" id="draft" type="button">💾 Simpan Draft</button><button id="kirim">Kirim ke Spreadsheet</button></div>
  <div id="bar"><i></i></div><div id="msg"></div>
</div>

<div class="box hide" id="gal">
  <div class="top"><h2 id="galT">Galeri</h2><button class="sec" id="reload">↻ Muat ulang</button></div>
  <div class="row" style="margin-top:8px"><button class="sec" id="xl1">⬇ Excel lokasi ini</button><button class="sec" id="xlAll">⬇ Excel semua lokasi</button></div>
  <small id="xlMsg" style="display:block;margin-top:6px;color:var(--mut)"></small>
  <div id="grid"></div>
</div>
</main>
<script>
// ====== GANTI DENGAN URL WEB APP APPS SCRIPT ANDA (berakhiran /exec) ======
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4mMeLHyILPs0Cv8oMVQHi4u2uueG8fXRLuhFzu6bjW9-pq7HyFhuE7-GeDx1qNgPw/exec";
// Daftar lokasi & item dibaca otomatis dari tab "Master_Lokasi" di spreadsheet (tidak perlu edit HTML).
let LOKASI = {};
const $ = s => document.querySelector(s);
let fotos = [];
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ready = APPS_SCRIPT_URL.startsWith("http");
$("#warn").style.display = ready ? "none" : "block";

async function loadLokasi() {
  $("#lokasi").innerHTML = '<option value="">Memuat lokasi…</option>';
  try {
    const j = await (await fetch(APPS_SCRIPT_URL + "?mode=lokasi")).json();
    if (!j.ok) throw new Error(j.error);
    LOKASI = j.lokasi;
    const n = Object.keys(LOKASI);
    $("#lokasi").innerHTML = '<option value="">-- Pilih lokasi --</option>' + n.map(l => `<option>${esc(l)}</option>`).join("");
    if (!n.length) $("#lokasi").innerHTML = '<option value="">Master_Lokasi masih kosong</option>';
  } catch (e) { $("#lokasi").innerHTML = '<option value="">Gagal memuat lokasi – muat ulang halaman</option>'; }
}
$("#lokasi").innerHTML = '<option value="">-- Pilih lokasi --</option>';
if (ready) loadLokasi();
$("#auditor").value = localStorage.getItem("auditor") || "";
function now() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  $("#tgl").value = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  $("#jam").value = p(d.getHours()) + ":" + p(d.getMinutes());
}

$("#lokasi").onchange = () => {
  const l = $("#lokasi").value;
  $("#form").classList.toggle("hide", !l); $("#gal").classList.toggle("hide", !l);
  if (!l) return;
  fillItems(LOKASI[l][0]);
  $("#galT").textContent = "Galeri – " + l;
  GAL = []; $("#ref").innerHTML = ""; switchKey(); loadGal();
};

function compress(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = im.width * s; c.height = im.height * s;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
$("#file").onchange = async e => {
  for (const f of e.target.files) fotos.push(await compress(f));
  e.target.value = ""; showPrev();
};
function showPrev() {
  $("#prev").innerHTML = fotos.map((f, i) => `<div><img src="${f}"><b onclick="fotos.splice(${i},1);showPrev()">×</b><b class="rt" onclick="retake(${i})">↻</b></div>`).join("")
    + (fotos.length ? '<small style="grid-column:1/-1;color:var(--mut)">↻ ambil ulang foto • × hapus foto</small>' : "");
}

// Foto diambil lewat Apps Script (tidak tergantung izin berbagi Drive) dan dimuat saat terlihat di layar
const IMG = {};
function fotoUrl(id) {
  if (!IMG[id]) IMG[id] = fetch(APPS_SCRIPT_URL + "?foto=" + encodeURIComponent(id)).then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
    .catch(e => { delete IMG[id]; throw e; });
  return IMG[id];
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  io.unobserve(e.target);
  const id = e.target.dataset.id;
  fotoUrl(id).then(u => { e.target.src = u; }).catch(() => { delete IMG[id]; e.target.alt = "Foto gagal dimuat"; });
}), { rootMargin: "200px" });
function loadImgs() { document.querySelectorAll("img[data-id]").forEach(i => io.observe(i)); }

let GAL = [];
const card = r => `<div class="g"><a href="${esc(r.link)}" target="_blank" rel="noopener"><img data-id="${esc(r.id)}" alt=""></a>
  <div><span class="t ${esc(r.tahap)}">${esc(r.tahap)}</span><small>${esc(r.tanggal)} • ${esc(r.jam)} • ${esc(r.auditor)}</small>${r.catatan ? `<small>${esc(r.catatan)}</small>` : ""}</div></div>`;

// Foto Before dari item yang dipilih, tampil di bawah form sebagai acuan
function showRef() {
  const it = $("#item").value, b = GAL.filter(r => r.item === it && r.tahap === "Before");
  $("#ref").innerHTML = b.length
    ? `<label>Foto Before – ${esc(it)}</label><div class="grid">${b.slice(0, 4).map(card).join("")}</div>`
    : `<small style="color:var(--mut);display:block;margin-top:8px">Belum ada foto Before untuk item ini.</small>`;
  loadImgs();
}
// ---- Ambil ulang foto ----
let reIdx = -1;
function retake(i) { reIdx = i; $("#re").click(); }
$("#re").onchange = async e => {
  if (e.target.files[0] && reIdx >= 0) { fotos[reIdx] = await compress(e.target.files[0]); showPrev(); }
  e.target.value = "";
};

// ---- Draft (tersimpan di perangkat ini, per lokasi + jenis foto + item) ----
const DBP = new Promise((res, rej) => { const q = indexedDB.open("auditDraft", 1); q.onupgradeneeded = () => q.result.createObjectStore("d"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const idb = async (mode, fn) => { const db = await DBP; return new Promise((res, rej) => { const t = db.transaction("d", mode), r = fn(t.objectStore("d")); t.oncomplete = () => res(r.result); t.onerror = () => rej(t.error); }); };
let cur = "", DR = new Set();
idb("readonly", s => s.getAllKeys()).then(k => { DR = new Set(k); }).catch(() => {});
const keyNow = () => [$("#lokasi").value, $("#tahap").value, $("#item").value].join("|");

function fillItems(sel) {
  const l = $("#lokasi").value, t = $("#tahap").value, v = sel || $("#item").value;
  $("#item").innerHTML = (LOKASI[l] || []).map(i => `<option value="${esc(i)}">${esc(i)}${DR.has(l + "|" + t + "|" + i) ? " 💾" : ""}</option>`).join("");
  $("#item").value = v; if (!$("#item").value) $("#item").selectedIndex = 0;
}
async function saveDraft(k = cur) {
  if (!k || k.startsWith("|")) return false;
  try {
    if (fotos.length || $("#cat").value.trim()) {
      await idb("readwrite", s => s.put({ tanggal: $("#tgl").value, jam: $("#jam").value, catatan: $("#cat").value, fotos }, k)); DR.add(k);
    } else { await idb("readwrite", s => s.delete(k)); DR.delete(k); }
    fillItems(); return true;
  } catch (e) { console.error(e); return false; }
}
async function switchKey() {            // simpan draft item sebelumnya, muat draft item yang baru dipilih
  await saveDraft(cur);
  cur = keyNow(); fillItems();
  let d = null; try { d = await idb("readonly", s => s.get(cur)); } catch (e) {}
  fotos = d ? d.fotos : []; $("#cat").value = d ? d.catatan : "";
  if (d) { $("#tgl").value = d.tanggal; $("#jam").value = d.jam; } else now();
  showPrev(); showRef();
  $("#msg").textContent = d ? "💾 Draft untuk item ini dimuat." : "";
}
$("#draft").onclick = async () => {
  const ok = await saveDraft(keyNow());
  $("#msg").textContent = ok ? "💾 Draft tersimpan di perangkat ini. Aman walau halaman ditutup." : "Belum ada foto/catatan untuk disimpan.";
};
document.addEventListener("visibilitychange", () => { if (document.hidden) saveDraft(); });
$("#item").onchange = $("#tahap").onchange = switchKey;

// Galeri per item: Before di kiri, After di kanan
function showGal() {
  const l = $("#lokasi").value;
  const items = [...new Set([...(LOKASI[l] || []), ...GAL.map(r => r.item)])];
  const html = items.map(it => {
    const b = GAL.filter(r => r.item === it && r.tahap === "Before"), a = GAL.filter(r => r.item === it && r.tahap === "After");
    if (!b.length && !a.length) return "";
    return `<div class="grp"><h3>${esc(it)}</h3><div class="cols">
      <div><p class="cap">Before</p>${b.map(card).join("") || "<small>Belum ada</small>"}</div>
      <div><p class="cap">After</p>${a.map(card).join("") || "<small>Belum ada</small>"}</div></div></div>`;
  }).join("");
  $("#grid").innerHTML = html || "<small>Belum ada foto untuk lokasi ini.</small>";
  loadImgs();
}

async function loadGal() {
  const l = $("#lokasi").value; if (!l || !ready) return;
  $("#grid").innerHTML = "<small>Memuat…</small>";
  try {
    const j = await (await fetch(APPS_SCRIPT_URL + "?lokasi=" + encodeURIComponent(l))).json();
    if (!j.ok) throw new Error(j.error);
    GAL = j.data; showGal(); showRef();
  } catch (e) { $("#grid").innerHTML = "<small>Gagal memuat galeri: " + esc(e.message) + "</small>"; }
}
$("#reload").onclick = loadGal;

// ---- Unduh Excel dengan foto tertanam (pustaka ExcelJS dimuat saat tombol ditekan) ----
const loadScript = src => new Promise((ok, no) => {
  if (window.ExcelJS) return ok();
  const s = document.createElement("script"); s.src = src; s.onload = ok;
  s.onerror = () => no(new Error("Gagal memuat pustaka Excel (cek internet)")); document.head.appendChild(s);
});
const dim = u => new Promise(ok => { const i = new Image(); i.onload = () => ok({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => ok({ w: 4, h: 3 }); i.src = u; });

async function dataLokasi(l) {            // satu baris per item: Before & After berpasangan
  const j = await (await fetch(APPS_SCRIPT_URL + "?lokasi=" + encodeURIComponent(l))).json();
  if (!j.ok) throw new Error(j.error);
  const rec = j.data.slice().reverse();   // urut kronologis
  const items = [...new Set([...(LOKASI[l] || []), ...rec.map(r => r.item)])], rows = [];
  items.forEach(it => {
    const b = rec.filter(r => r.item === it && r.tahap === "Before"), a = rec.filter(r => r.item === it && r.tahap === "After");
    for (let k = 0; k < Math.max(b.length, a.length, 1); k++) rows.push({ item: it, b: b[k], a: a[k] });
  });
  return rows;
}

async function unduhExcel(daftar) {
  const msg = $("#xlMsg"), btn = [$("#xl1"), $("#xlAll")];
  btn.forEach(b => b.disabled = true);
  try {
    msg.textContent = "Menyiapkan…";
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js");
    const wb = new ExcelJS.Workbook(), x = (o, k) => o ? o[k] : "";
    for (const l of daftar) {
      msg.textContent = "Mengambil data " + l + "…";
      const rows = await dataLokasi(l);
      const ids = rows.flatMap(r => [r.b, r.a]).filter(Boolean).map(o => o.id);
      for (let i = 0; i < ids.length; i += 4) {          // ambil foto 4 sekaligus
        msg.textContent = `${l}: mengambil foto ${Math.min(i + 4, ids.length)}/${ids.length}…`;
        await Promise.allSettled(ids.slice(i, i + 4).map(fotoUrl));
      }
      const ws = wb.addWorksheet(l.replace(/[\\\/?*\[\]:]/g, "-").slice(0, 31), { views: [{ state: "frozen", ySplit: 1 }] });
      ws.columns = [["Item", 28], ["Foto Before", 46], ["Foto After", 46], ["Tgl Before", 12], ["Jam Before", 9], ["Auditor Before", 14],
        ["Catatan Before", 32], ["Tgl After", 12], ["Jam After", 9], ["Auditor After", 14], ["Catatan After", 32]].map(([header, width]) => ({ header, width }));
      ws.getRow(1).height = 24;
      ws.getRow(1).eachCell(c => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFED1B24" } }; c.font = { bold: true, color: { argb: "FFFFFFFF" } }; c.alignment = { vertical: "middle", wrapText: true }; });
      for (const row of rows) {
        const r = ws.addRow([row.item, "", "", x(row.b, "tanggal"), x(row.b, "jam"), x(row.b, "auditor"), x(row.b, "catatan"),
                             x(row.a, "tanggal"), x(row.a, "jam"), x(row.a, "auditor"), x(row.a, "catatan")]);
        r.height = 190; r.alignment = { vertical: "middle", wrapText: true };
        for (const [o, col] of [[row.b, 1], [row.a, 2]]) {
          if (!o) continue;
          let u = null; try { u = await fotoUrl(o.id); } catch (e) {}
          if (!u) { r.getCell(col + 1).value = "(foto gagal dimuat)"; continue; }
          const d = await dim(u), s = Math.min(315 / d.w, 240 / d.h);
          const id = wb.addImage({ base64: u, extension: /image\/png/.test(u) ? "png" : "jpeg" });
          ws.addImage(id, { tl: { col: col + 0.04, row: r.number - 1 + 0.04 }, ext: { width: d.w * s, height: d.h * s }, editAs: "oneCell" });
        }
      }
    }
    msg.textContent = "Menyusun file Excel…";
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    a.download = "Laporan_Audit_" + (daftar.length > 1 ? "Semua_Lokasi" : daftar[0]) + "_" + new Date().toISOString().slice(0, 10) + ".xlsx";
    document.body.appendChild(a); a.click(); a.remove();
    msg.textContent = "✅ File Excel selesai dibuat.";
  } catch (e) { msg.textContent = "Gagal: " + e.message; console.error(e); }
  btn.forEach(b => b.disabled = false);
}
$("#xl1").onclick = () => unduhExcel([$("#lokasi").value]);
$("#xlAll").onclick = () => unduhExcel(Object.keys(LOKASI));

$("#kirim").onclick = async () => {
  const msg = $("#msg"), auditor = $("#auditor").value.trim();
  if (!ready) { msg.textContent = "URL Apps Script belum diisi."; return; }
  if (!auditor) { msg.textContent = "Isi nama auditor dulu."; return; }
  if (!fotos.length) { msg.textContent = "Pilih minimal satu foto."; return; }
  localStorage.setItem("auditor", auditor);
  $("#kirim").disabled = true; $("#bar").style.display = "block"; msg.textContent = "";
  const base = { lokasi: $("#lokasi").value, tanggal: $("#tgl").value, jam: $("#jam").value, auditor, tahap: $("#tahap").value, item: $("#item").value, catatan: $("#cat").value.trim() };
  let ok = 0; const sisa = [];
  for (let i = 0; i < fotos.length; i++) {
    try {
      const j = await (await fetch(APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...base, foto: fotos[i] }) })).json();
      if (!j.ok) throw new Error(j.error);
      ok++;
    } catch (e) { sisa.push(fotos[i]); console.error(e); }
    $("#bar i").style.width = ((i + 1) / fotos.length * 100) + "%";
  }
  fotos = sisa; showPrev(); $("#kirim").disabled = false;
  msg.textContent = sisa.length ? `${ok} terkirim, ${sisa.length} gagal. Tekan kirim lagi untuk mengulang.` : `✅ ${ok} foto berhasil masuk ke spreadsheet.`;
  if (!sisa.length) $("#cat").value = "";
  saveDraft();
  loadGal();
};
</script>
